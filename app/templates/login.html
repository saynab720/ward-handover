{% extends "base.html" %}
{% block title %}Sign in – Ward Handover{% endblock %}
{% block content %}
<div class="login-box">
  <h1>Sign in</h1>
  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="{{ email }}" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>
  <p class="muted small">You'll be signed out automatically after 30 minutes of inactivity.</p>
</div>
{% endblock %}
